<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>整理券ゲーム</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  height:100%;
  overscroll-behavior-y:none;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#efefef;
}
#scroll{
  height:calc(100vh - 64px);
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-y;
}
#pull{height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:#fff;transition:height .15s}
#spinner{width:28px;height:28px;border:3px solid #d1d5db;border-top-color:#374151;border-radius:50%}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:#fff;border-radius:16px;padding:16px;margin:16px}
button{width:100%;padding:13px;border:none;border-radius:12px;font-weight:700}
</style>
</head>
<body>
<div style="background:#fff;padding:14px 18px 10px;font-weight:700">整理券</div>

<div id="scroll">
  <div id="pull">
    <div id="spinner"></div>
    <div id="label" style="font-size:11px;color:#888;margin:6px 0 8px">↓ 下に引っ張って更新</div>
  </div>

  <div class="card">
    <button id="start" style="background:#2563eb;color:#fff">ゲーム開始（10秒）</button>
    <div style="margin-top:16px;font-weight:700">FRUITS ZIPPER</div>
    <div id="state" style="margin-top:12px;background:#e5e7eb;padding:10px;border-radius:10px;text-align:center;font-weight:700">受付前</div>
    <div id="sub" style="margin-top:8px;font-size:12px;color:#666">ゲーム開始待ち</div>
    <button id="issue" disabled style="margin-top:12px;background:#d1d5db;color:#fff">先着配布</button>
  </div>

  <div style="height:500px"></div>
</div>

<script>
const WAIT=10;
let ready=false,started=false,startY=0,pulling=false,dist=0,startTime=0;
const scroll=document.getElementById('scroll');

document.getElementById('start').onclick=()=>{
  if(started)return;
  started=true;
  startTime=Date.now();
  tick();
};

function tick(){
  const t=(Date.now()-startTime)/1000;
  if(t<WAIT){
    document.getElementById('sub').textContent=`受付開始まで ${(WAIT-t).toFixed(1)} 秒`;
    requestAnimationFrame(tick);
    return;
  }
  ready=true;
  document.getElementById('sub').textContent='下に引っ張って更新';
}

scroll.addEventListener('touchstart',e=>{
  if(scroll.scrollTop===0){
    pulling=true;
    startY=e.touches[0].clientY;
  }
},{passive:true});

scroll.addEventListener('touchmove',e=>{
  if(!pulling)return;
  dist=Math.max(0,e.touches[0].clientY-startY);

  if(scroll.scrollTop===0 && dist>0){
    e.preventDefault();
  }

  const h=Math.min(dist*0.8,70);
  document.getElementById('pull').style.height=h+'px';
  document.getElementById('spinner').classList.add('spin');
  document.getElementById('label').textContent=h>40?'離して更新':'↓ 下に引っ張って更新';
},{passive:false});

scroll.addEventListener('touchend',()=>{
  if(!pulling)return;
  pulling=false;

  if(dist<40){
    reset(); return;
  }

  document.getElementById('label').textContent='更新中…';

  setTimeout(()=>{
    reset();
    if(ready){
      const s=document.getElementById('state');
      s.textContent='受付中';
      s.style.background='#16A34A';
      s.style.color='white';

      const b=document.getElementById('issue');
      b.disabled=false;
      b.style.background='#111';
      b.style.color='white';

      document.getElementById('sub').textContent='更新完了';
    }
  },700);
});

function reset(){
  document.getElementById('pull').style.height='0px';
  document.getElementById('spinner').classList.remove('spin');
  document.getElementById('label').textContent='↓ 下に引っ張って更新';
}
</script>
</body>
</html>
